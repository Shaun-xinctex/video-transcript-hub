# Helper buildspec: CodeBuild as courier for the Lambda artifacts.
#
# Run with --buildspec-override lambda-build.buildspec.yml; it does not build
# the worker image. The Cowork sandbox is proxy-blocked from S3 and the AWS MCP
# runs in a separate filesystem, so neither can put a zip in a bucket. The build
# container can, so it downloads the deps, zips them, and uploads both artifacts.
#
# ARTIFACTS_BUCKET comes from --environment-variables-override, never hardcoded:
# a hardcoded bucket breaks the moment this is mirrored to another account.
#
# Every command is quoted. "--only-binary=:all:" contains a colon-space, which
# unquoted YAML reads as a nested key -- CodeBuild then rejects the file with
# "Expected Commands[N] to be of string type: found subkeys instead".
version: 0.2

phases:
  build:
    commands:
      # pip install --target, not pip download: download has no --target flag,
      # and it would fetch .whl files rather than the extracted packages a
      # Lambda layer needs under python/. The version/platform pins force cp312
      # manylinux wheels (pydantic-core and cffi ship compiled binaries, so
      # building on the CodeBuild image's own Python would produce the wrong ABI).
      - "pip install --platform manylinux2014_x86_64 --python-version 3.12 --implementation cp --only-binary=:all: --target python supabase boto3"
      - "zip -rq deps-layer.zip python"
      - "aws s3 cp deps-layer.zip s3://${ARTIFACTS_BUCKET}/deps-layer.zip"
      # The handler must sit at the zip root for the lambda_distributor.handler
      # entry point to resolve, hence the cd into worker/.
      - "cd worker && zip -q ../handler.zip lambda_distributor.py && cd .."
      - "aws s3 cp handler.zip s3://${ARTIFACTS_BUCKET}/handler.zip"
